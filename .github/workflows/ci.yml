name: Build Armbian for OneCloud

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - readme
    paths:
      - .github/workflows/ci.yml

env:
  SCRIPT_REPO: ${{ github.repository }}
  SCRIPT_REF: ${{ github.ref_name }}
  UBOOT_REPO: hzyitc/u-boot-onecloud
  UBOOT_RELEASE: latest
  UBOOT_BURNIMG: eMMC.burn.img
  ARMBIAN_REPO: armbian/build
  ARMBIAN_REF: main
  PATCHES: 4077,5076

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Environment
    runs-on: ubuntu-22.04
    outputs:
      env: ${{ steps.get.outputs.env }}
      tag: ${{ steps.get.outputs.tag }}
    steps:
      - id: get
        name: Get repositories information
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          api_get() {
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "$1"
          }

          TIME="$(api_get "https://api.github.com/repos/${SCRIPT_REPO}/actions/runs/${GITHUB_RUN_ID}" | jq -r '.created_at // empty' || true)"
          if [ -z "${TIME}" ]; then
            TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          fi

          TAG="v$(date -d "${TIME}" -u +'%Y.%m.%d-%H%M')"

          SCRIPT_SHA="$(api_get "https://api.github.com/repos/${SCRIPT_REPO}/commits/${SCRIPT_REF}" | jq -r '.sha // empty' || true)"
          [ -n "${SCRIPT_SHA}" ] || SCRIPT_SHA="${GITHUB_SHA}"

          UBOOT_TAG="$(api_get "https://api.github.com/repos/${UBOOT_REPO}/releases/${UBOOT_RELEASE}" | jq -r '.tag_name // empty' || true)"
          [ -n "${UBOOT_TAG}" ] || { echo "::error::Failed to resolve U-Boot release tag"; exit 1; }

          ARMBIAN_SHA="$(api_get "https://api.github.com/repos/${ARMBIAN_REPO}/commits/${ARMBIAN_REF}" | jq -r '.sha // empty' || true)"
          [ -n "${ARMBIAN_SHA}" ] || { echo "::error::Failed to resolve Armbian commit SHA"; exit 1; }

          {
            echo "TIME=${TIME}"
            echo "TAG=${TAG}"
            echo "SCRIPT_SHA=${SCRIPT_SHA}"
            echo "UBOOT_TAG=${UBOOT_TAG}"
            echo "ARMBIAN_SHA=${ARMBIAN_SHA}"
          } >> "$GITHUB_ENV"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "env=$(base64 -w 0 < "$GITHUB_ENV")" >> "$GITHUB_OUTPUT"

      - name: Create Release Placeholder
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: OneCloud Armbian Release ${{ steps.get.outputs.tag }}
          body: |
            ## 玩客云 OneCloud (S805) Armbian 固件发布
            - **内置 HDMI 输出补丁**：支持显示器命令行及桌面显示输出。
            - **包含格式**：压缩后的标准 `.img.xz` 镜像及 `.burn.img.xz` Amlogic 线刷包。

            ### 源码信息
            - Armbian Build: [${{ env.ARMBIAN_REPO }}](https://github.com/${{ env.ARMBIAN_REPO }}/tree/${{ env.ARMBIAN_SHA }})
            - U-Boot: [${{ env.UBOOT_REPO }}](https://github.com/${{ env.UBOOT_REPO }}/releases/tag/${{ env.UBOOT_TAG }})

  build-kernel:
    name: Build Kernel
    needs: prepare
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        BRANCH: [current]
    steps:
      - name: Import env
        run: echo "${{ needs.prepare.outputs.env }}" | base64 -d >> "$GITHUB_ENV"

      - name: Checkout Armbian
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ARMBIAN_REPO }}
          ref: ${{ env.ARMBIAN_SHA }}

      - name: Apply HDMI and System Patches
        if: ${{ env.PATCHES }}
        run: |
          set -euo pipefail
          IFS=',' read -ra patch_ids <<< "${PATCHES}"
          for patch_id in "${patch_ids[@]}"; do
            patch_file="pr-${patch_id}.patch"
            echo "::group::Download ${patch_file}"
            curl -fsSL -o "${patch_file}" "https://github.com/armbian/build/pull/${patch_id}.patch"
            test -s "${patch_file}" || { echo "::error::Downloaded patch ${patch_id} is empty"; exit 1; }
            echo "::endgroup::"

            echo "::group::Applying ${patch_file}"
            patch --batch -p1 -N < "${patch_file}" || echo "Patch ${patch_file} applied with warnings or already applied"
            echo "::endgroup::"
          done

      - name: Cache Ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-${{ matrix.BRANCH }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ matrix.BRANCH }}-

      - name: Build Kernel Debs
        run: |
          set -euo pipefail
          export GITHUB_ACTIONS=false
          mkdir -p .ccache
          ./compile.sh kernel \
            ALLOW_ROOT=yes BOARD=onecloud BRANCH=${{ matrix.BRANCH }} \
            EXPERT=yes USE_CCACHE=yes CCACHE_DIR="$(pwd)/.ccache" SKIP_INIT_BINFMTS=yes
          sudo chown "$(id -u):$(id -g)" -R output/
          sudo chown "$(id -u):$(id -g)" -R .ccache

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.BRANCH }}
          path: output/debs/
          retention-days: 1

  build-images:
    name: Build ${{ matrix.RELEASE }} (${{ matrix.TYPE }})
    needs: [prepare, build-kernel]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        BRANCH: [current]
        RELEASE: [bookworm, jammy]
        TYPE: [minimal, cli, xfce_desktop]
        include:
          - TYPE: xfce_desktop
            DESKTOP_ENVIRONMENT: xfce
            DESKTOP_ENVIRONMENT_CONFIG_NAME: config_base
            DESKTOP_APPGROUPS_SELECTED: ""

    steps:
      - name: Import env
        run: echo "${{ needs.prepare.outputs.env }}" | base64 -d >> "$GITHUB_ENV"

      - name: Checkout Armbian
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ARMBIAN_REPO }}
          ref: ${{ env.ARMBIAN_SHA }}

      - name: Apply HDMI and System Patches
        if: ${{ env.PATCHES }}
        run: |
          set -euo pipefail
          IFS=',' read -ra patch_ids <<< "${PATCHES}"
          for patch_id in "${patch_ids[@]}"; do
            patch_file="pr-${patch_id}.patch"
            echo "::group::Download ${patch_file}"
            curl -fsSL -o "${patch_file}" "https://github.com/armbian/build/pull/${patch_id}.patch"
            test -s "${patch_file}" || { echo "::error::Downloaded patch ${patch_id} is empty"; exit 1; }
            echo "::endgroup::"

            echo "::group::Applying ${patch_file}"
            patch --batch -p1 -N < "${patch_file}" || echo "Patch ${patch_file} applied with warnings"
            echo "::endgroup::"
          done

      - name: Download Kernel Debs
        uses: actions/download-artifact@v4
        with:
          name: debs-${{ matrix.BRANCH }}
          path: output/debs/

      - name: Install Host Tools & Setup binfmt
        run: |
          set -euo pipefail
          sudo apt update
          sudo apt install -y qemu-user-static binfmt-support arch-test debootstrap systemd-container ca-certificates img2simg
          sudo update-binfmts --enable qemu-arm || true
          sudo update-binfmts --enable qemu-aarch64 || true

      - name: Compile Armbian OS Image
        run: |
          set -euo pipefail
          export GITHUB_ACTIONS=false
          
          BUILD_MINIMAL="no"
          BUILD_DESKTOP="no"
          DESKTOP_ENV=""
          DESKTOP_CFG=""
          DESKTOP_APPS=""

          if [ "${{ matrix.TYPE }}" = "minimal" ]; then
            BUILD_MINIMAL="yes"
          elif [ "${{ matrix.TYPE }}" = "xfce_desktop" ]; then
            BUILD_DESKTOP="yes"
            DESKTOP_ENV="${{ matrix.DESKTOP_ENVIRONMENT }}"
            DESKTOP_CFG="${{ matrix.DESKTOP_ENVIRONMENT_CONFIG_NAME }}"
            DESKTOP_APPS="${{ matrix.DESKTOP_APPGROUPS_SELECTED }}"
          fi

          ./compile.sh build \
            ALLOW_ROOT=yes PREFER_DOCKER=no BOARD=onecloud BRANCH=${{ matrix.BRANCH }} RELEASE=${{ matrix.RELEASE }} \
            KERNEL_CONFIGURE=no EXPERT=yes SKIP_EXTERNAL_TOOLCHAINS=yes USE_CCACHE=no \
            SKIP_INIT_BINFMTS=no \
            BUILD_MINIMAL="${BUILD_MINIMAL}" \
            BUILD_DESKTOP="${BUILD_DESKTOP}" \
            DESKTOP_ENVIRONMENT="${DESKTOP_ENV}" \
            DESKTOP_ENVIRONMENT_CONFIG_NAME="${DESKTOP_CFG}" \
            DESKTOP_APPGROUPS_SELECTED="${DESKTOP_APPS}" \
            COMPRESS_OUTPUTIMAGE=img

          sudo chown "$(id -u):$(id -g)" -R output/

      - name: Generate Amlogic .burn.img & Standardize Names
        id: postprocess
        run: |
          set -euo pipefail

          # 下载 AmlImg 工具
          curl -fsSL -o ./AmlImg https://github.com/hzyitc/AmlImg/releases/download/v0.3.1/AmlImg_v0.3.1_linux_amd64
          chmod +x ./AmlImg

          # 解析版本号
          DEB_FILE="$(find output/debs -maxdepth 1 -type f -name 'linux-image-*__*.deb' | head -n 1 || true)"
          if [ -z "${DEB_FILE}" ]; then
            DEB_FILE="$(find output/debs -maxdepth 1 -type f -name 'linux-image-*.deb' | head -n 1 || true)"
          fi

          FILENAME="$(basename "${DEB_FILE}" .deb)"
          if [[ "${FILENAME}" =~ _([0-9]+\.[0-9]+\.[0-9]+(-trunk)?)__ ]]; then
            ARMBIAN_VER="${BASH_REMATCH[1]}"
          else
            ARMBIAN_VER="26.08.0"
          fi

          if [[ "${FILENAME}" =~ __([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            REAL_KERNEL="${BASH_REMATCH[1]}"
          else
            REAL_KERNEL="$(echo "${FILENAME}" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | tail -n1 || true)"
            [ -n "${REAL_KERNEL}" ] || REAL_KERNEL="6.12.28"
          fi

          BASE_NAME="Armbian_${ARMBIAN_VER}_Onecloud_${{ matrix.RELEASE }}_${{ matrix.BRANCH }}_${REAL_KERNEL}_${{ matrix.TYPE }}"
          
          # 下载 U-Boot 并解包打包 .burn.img
          curl -fsSL -o ./uboot.img "https://github.com/${UBOOT_REPO}/releases/download/${UBOOT_TAG}/${UBOOT_BURNIMG}"
          rm -rf burn
          ./AmlImg unpack ./uboot.img burn/

          diskimg="$(find output/images -maxdepth 1 -type f -name '*.img' ! -name '*.burn.img' | head -n 1 || true)"
          [ -n "${diskimg}" ] || { echo "::error::No raw .img found"; exit 1; }

          loop=""
          cleanup() {
            if [ -n "${loop}" ]; then
              sudo losetup -d "${loop}" || true
            fi
          }
          trap cleanup EXIT

          loop="$(sudo losetup --find --show --partscan "${diskimg}")"
          sudo img2simg "${loop}p1" burn/boot.simg
          sudo img2simg "${loop}p2" burn/rootfs.simg

          echo -n "sha1sum $(sha1sum burn/boot.simg | awk '{print $1}')" > burn/boot.VERIFY
          echo -n "sha1sum $(sha1sum burn/rootfs.simg | awk '{print $1}')" > burn/rootfs.VERIFY

          cat <<EOF >> burn/commands.txt
          PARTITION:boot:sparse:boot.simg
          VERIFY:boot:normal:boot.VERIFY
          PARTITION:rootfs:sparse:rootfs.simg
          VERIFY:rootfs:normal:rootfs.VERIFY
          EOF

          ./AmlImg pack "output/images/${BASE_NAME}.burn.img" burn/
          mv "${diskimg}" "output/images/${BASE_NAME}.img"

          echo "armbian_ver=${ARMBIAN_VER}" >> "$GITHUB_OUTPUT"
          echo "kernel_ver=${REAL_KERNEL}" >> "$GITHUB_OUTPUT"

      - name: Compress Images with XZ
        run: |
          set -euo pipefail
          cd output/images/
          for f in *.img; do
            [ -f "${f}" ] || continue
            sha256sum "${f}" >> sha256sums.txt
            xz -9 --threads=0 "${f}"
          done

      - name: Upload Images to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          append_body: true
          body: |
            ---
            ### 构建规格: ${{ matrix.RELEASE }} - ${{ matrix.TYPE }}
            - **Armbian 版本**: `${{ steps.postprocess.outputs.armbian_ver }}`
            - **内核版本**: `${{ steps.postprocess.outputs.kernel_ver }}`
            - **系统包库**: `${{ matrix.RELEASE }}`
          files: |
            output/images/*.xz
            output/images/sha256sums.txt
